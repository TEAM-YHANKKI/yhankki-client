# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"

# 리뷰 톤 및 스타일
tone_instructions: |
  한국어 존댓말(~해요체)로 친절하고 건설적인 리뷰를 제공해요.
  보안, 성능, 유지보수성을 최우선으로 하며, 불확실한 부분은 질문으로 남겨주세요.
  단순한 개인 취향보다는 기술적 근거와 팀 컨벤션을 중심으로 설명해주세요.

reviews:
  profile: "chill"
  high_level_summary: true
  auto_review:
    enabled: true
    ignore_usernames: ["dependabot", "renovate"]

  # 불필요한 노이즈 제거
  poem: false
  sequence_diagrams: false

  # 파일 필터링 (일반적인 제외 패턴)
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!build/**"
    - "!**/*.lock"
    - "!**/*.png"
    - "!**/*.svg"

  # 경로별 지침 (단일 레포 구조에 최적화)
  path_instructions:
    # 1. React 컴포넌트 (.tsx)
    - path: "src/**/*.tsx"
      instructions: |
        React 컴포넌트 리뷰:
        - 컴포넌트 명은 PascalCase, 파일명은 kebab-case 준수
        - 불필요한 <div> 지양, Fragment(<>) 사용
        - Props 타입은 '컴포넌트명+Props' 형식 사용
        - 이벤트 핸들러는 'handle' 접두사 사용
        - SVG는 ?react 쿼리로 컴포넌트화하여 사용
        - 반복 렌더링이 예상되면 useMemo/useCallback 제안

    # 2. 스타일 (Vanilla Extract, .css.ts)
    - path: "src/**/*.css.ts"
      instructions: |
        Vanilla Extract 스타일 리뷰:
        - 스타일은 반드시 .css.ts 파일로 분리 (인라인 스타일 금지)
        - 디자인 토큰(vars) 적극 활용
        - 상태에 따른 스타일은 recipe 사용 권장
        - 중복되는 스타일은 제거하고 재사용성 고려

    # 3. 비즈니스 로직, 훅, 유틸 (.ts)
    - path: "src/**/*.ts"
      instructions: |
        TypeScript 및 로직 리뷰:
        - [Hook] use* 접두사 사용 및 의존성 배열(exhaustive-deps) 확인
        - [Query] TanStack Query 훅은 'use+행위+대상+Query/Mutation' 네이밍 (예: useGetUserListQuery)
        - [API] Axios 래퍼 사용 및 'HTTP메서드+명사' 네이밍 (예: getUserList)
        - [Type] 객체 구조는 interface 사용을 지향 (확장성 고려)
        - [Type] Response 타입은 XXXResponse 형식 준수
        - [Utils] 순수 함수 유지, 도메인 의존성 최소화
        - any 타입 사용 금지, 구체적인 타입 지정

    # 4. 전역 설정 및 기타
    - path: "**/*"
      instructions: |
        전반적인 프로젝트 규칙:
        - 절대 경로 import 사용 (@/components, @/hooks 등)
        - 환경 변수는 import.meta.env 사용 (비밀키 하드코딩 금지)
        - 상수는 UPPER_SNAKE_CASE 및 as const 활용
        - 커밋 메시지 컨벤션 (feat, fix, refactor 등) 준수 확인

chat:
  auto_reply: true
